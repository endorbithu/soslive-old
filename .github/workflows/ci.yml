name: CI

on:
  push:
  pull_request:

jobs:
  mock-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mock-server/package-lock.json
      - run: npm ci
      - run: npm test

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Core package unit tests
        run: swift test --package-path Packages/SOSliveCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SOSlive.xcodeproj -scheme SOSlive \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -n 200

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soslive-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
