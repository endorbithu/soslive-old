# Optional local RTMP/HLS server for trying out streaming during development. Not needed in
# production: users enter their own streaming service in the app's settings.
#   docker compose up
#   app settings -> Streaming service:
#     RTMP(S) server URL: rtmp://<your-LAN-IP>:1935/live
#     Stream key:         test
#     Playback URL:       http://<your-LAN-IP>:8888/live/test/index.m3u8
#   (Android emulator: 10.0.2.2 instead of the LAN IP; iOS simulator: localhost)
#   watch:      ffplay rtmp://localhost:1935/live/test   or open the HLS URL
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"   # RTMP ingest
      - "8888:8888"   # HLS playback
