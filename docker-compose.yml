# Local RTMP/HLS server for testing the stream (there is no SOSlive backend any more).
#   docker compose up
#   app config: soslive.streamRtmpUrl=rtmp://<your-LAN-IP>:1935/live
#               soslive.streamHlsTemplate=http://<your-LAN-IP>:8888/live/{key}/index.m3u8
#   (Android emulator: 10.0.2.2 instead of the LAN IP; iOS simulator: localhost)
#   watch:      ffplay rtmp://localhost:1935/live/<key>   or open the HLS URL
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"   # RTMP ingest
      - "8888:8888"   # HLS playback
