# XcodeGen project definition – generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate
name: SOSlive
options:
  bundleIdPrefix: info.soslive
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  SOSliveCore:
    path: Packages/SOSliveCore
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    minorVersion: 1.9.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0

targets:
  SOSlive:
    type: application
    platform: iOS
    sources:
      - path: SOSlive
    dependencies:
      - package: SOSliveCore
      - package: HaishinKit
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.soslive.stream
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(SOSLIVE_DEVELOPMENT_TEAM)
        ENABLE_PREVIEWS: YES
    info:
      path: SOSlive/Info.plist
      properties:
        CFBundleDisplayName: SOSlive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, hu]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: SOSlive streams live video from your camera and takes incident photos.
        NSMicrophoneUsageDescription: SOSlive records audio for the live stream.
        NSLocationWhenInUseUsageDescription: Your location is attached to your incidents so helpers can find you.
        # App configuration (see Config/Base.xcconfig). There is no SOSlive backend.
        SOSliveWebappURL: $(SOSLIVE_WEBAPP_URL)
        SOSliveStreamRTMPURL: $(SOSLIVE_STREAM_RTMP_URL)
        SOSliveStreamHLSTemplate: $(SOSLIVE_STREAM_HLS_TEMPLATE)
        SOSliveGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        LSApplicationQueriesSchemes: [sms, mailto]

schemes:
  SOSlive:
    build:
      targets:
        SOSlive: all
    run:
      config: Debug
    archive:
      config: Release
