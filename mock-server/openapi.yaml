openapi: 3.0.3
info:
  title: SOSlive API
  version: 0.1.0
  description: |
    Contract between the SOSlive Android app and its backend.
    `mock-server/` is a throwaway simulation of this contract - the real backend should implement
    the same paths and payloads so the app keeps working unchanged.

    Errors always look like `{"error": {"code": "...", "message": "..."}}`.
    Authenticated calls use `Authorization: Bearer <accessToken>`; on 401 the app calls
    `/auth/refresh` once and retries.
servers:
  - url: http://localhost:3000
security:
  - bearer: []
paths:
  /health:
    get:
      security: []
      summary: Liveness + which SSO providers are verified or simulated
      responses:
        '200': { description: OK }
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                displayName: { type: string, maxLength: 80 }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: 'email_taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { description: invalid_credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: too_many_attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/google:
    post:
      security: []
      summary: Sign in / sign up with a Google ID token (Credential Manager). Links to an existing account with the same e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string, description: 'Google ID token, or "mock:<email>|<name>" when simulated' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/facebook:
    post:
      security: []
      summary: Sign in / sign up with a Facebook user access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken: { type: string, description: 'Facebook access token, or "mock:<email>|<name>" when simulated' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      security: []
      summary: Exchanges a refresh token for a new session (refresh tokens rotate - the old one becomes invalid).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Logged out }
  /me:
    get:
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                sosContacts:
                  type: array
                  maxItems: 10
                  items: { type: string, pattern: '^\+[0-9]{10,13}$' }
                sosMessage: { type: string, maxLength: 300 }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /events:
    get:
      summary: The current user's events, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
    post:
      summary: Creates an event. SOS / LIVE events include the RTMP target to publish to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/EventType' }
                lat: { type: number }
                lng: { type: number }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /events/{id}:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /events/{id}/location:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                accuracy: { type: number }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /events/{id}/stop:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    post:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /events/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    get:
      parameters:
        - { name: sinceId, in: query, schema: { type: integer }, description: Only comments with a larger id }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
  /events/{id}/photos:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Photo' } }
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    EventId: { name: id, in: path, required: true, schema: { type: integer } }
  responses:
    Session:
      description: Session
      content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: seconds }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        providers: { type: array, items: { type: string, enum: [password, google, facebook] } }
        sosContacts: { type: array, items: { type: string } }
        sosMessage: { type: string }
        createdAt: { type: string, format: date-time }
    EventType: { type: string, enum: [SOS, LIVE, PHOTO] }
    Location:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        at: { type: string, format: date-time }
    StreamTarget:
      type: object
      properties:
        url: { type: string, example: 'rtmp://host:1935/live' }
        streamKey: { type: string }
        publishUrl: { type: string, description: 'url + "/" + streamKey - what the app publishes to' }
    Event:
      type: object
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/EventType' }
        status: { type: string, enum: [LIVE, OPEN, STOPPED] }
        createdAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time, nullable: true }
        lastLocation: { allOf: [{ $ref: '#/components/schemas/Location' }], nullable: true }
        shareUrl: { type: string, description: Public page of the event, sent in SOS SMS }
        stream: { allOf: [{ $ref: '#/components/schemas/StreamTarget' }], nullable: true }
        commentCount: { type: integer }
        photoCount: { type: integer }
    Comment:
      type: object
      properties:
        id: { type: integer }
        eventId: { type: integer }
        authorName: { type: string }
        authorType: { type: string, enum: [OWNER, VIEWER] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    Photo:
      type: object
      properties:
        id: { type: integer }
        eventId: { type: integer }
        url: { type: string }
        createdAt: { type: string, format: date-time }
